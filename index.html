<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karna | Personal Profile</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #58a6ff;
            margin-bottom: 15px;
        }

        .name {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .bio {
            color: #8b949e;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #21262d;
            color: #c9d1d9;
            text-decoration: none;
            padding: 13px 18px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            border: 1px solid #30363d;
            transition: all 0.25s ease;
        }

        .link-btn:hover {
            background-color: #58a6ff;
            color: #ffffff;
            border-color: #58a6ff;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #6e7681;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- உங்கள் போட்டோ லிங்க் (imgbb, imgur போன்ற இடங்களில் அப்லோட் செய்து லிங்க் கொடுக்கலாம்) -->
        <img src="https://via.placeholder.com/150" alt="Profile" class="profile-img">

        <h1 class="name">ஹரி (Karna)</h1>
        <p class="bio">M.Sc Computer Science | Educator & Developer</p>

        <div class="links">
            <a href="https://wa.me/91XXXXXXXXXX" target="_blank" class="link-btn">
                <i class="fab fa-whatsapp"></i> WhatsApp Me
            </a>
            <a href="https://instagram.com/your_username" target="_blank" class="link-btn">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="https://t.me/your_username" target="_blank" class="link-btn">
                <i class="fab fa-telegram"></i> Telegram
            </a>
            <a href="https://x.com/your_username" target="_blank" class="link-btn">
                <i class="fab fa-x-twitter"></i> X (Twitter)
            </a>
            <a href="mailto:your_email@gmail.com" class="link-btn">
                <i class="fas fa-envelope"></i> Email
            </a>
        </div>

        <div class="footer">
            © 2026 Karna. All rights reserved.
        </div>
    </div>

</body>
</html>
